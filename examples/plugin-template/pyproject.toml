[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roleband-plugin-template"
version = "0.1.0"
description = "A minimal RoleBand plugin to copy."
license = "Apache-2.0"
requires-python = ">=3.11"
# A plugin depends on the SDK and nothing that reaches the network.
dependencies = ["roleband-plugin-sdk>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # as in backend/: line length is not enforced

[tool.ruff.lint.isort]
known-first-party = ["roleband_plugin_template"]
