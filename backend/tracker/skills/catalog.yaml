# RoleBand skill catalogue: the closed production vocabulary.
#
# Human-reviewed source of truth. No runtime auto-edit; every change lands via a
# reviewed diff. Compiled + validated by tracker/skills/catalog.py, projected into
# skill_concepts / skill_aliases. taxonomy_version = content hash of this file.
#
# Concept fields:
#   slug, display, facet, category, description  (all required)
#   parent: slug            optional containment hierarchy (S3 -> AWS)
#   aliases:                list; each needs at least {alias}
#     match: exact_ci (default) | exact_case
#     required_context: regex — unit must also match this for the hit to count
#     excluded_context: regex — a match overlapping the hit rejects it
#
# Facets: technology | professional_skill | industry |
#         behavioral_competency | language
# Two-bucket rule: `industry` = business vertical (the sector a company operates in;
# a candidate has experience IN it). Everything a candidate can DO is a skill
# (technology / professional_skill). Never present an industry as a skill.
version: 1
