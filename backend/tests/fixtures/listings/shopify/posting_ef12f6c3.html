<script>window.__reactRouterContext.streamController.enqueue("[{\"_1\":2},\"loaderData\",{\"_3\":4},\"($locale)/careers/$posting\",{\"_5\":6},\"jobPosting\",{\"_7\":8,\"_9\":10,\"_11\":12,\"_13\":14,\"_15\":16,\"_17\":-5,\"_18\":19,\"_26\":27,\"_28\":27,\"_29\":30,\"_31\":32,\"_33\":34,\"_35\":36,\"_41\":42,\"_43\":44,\"_80\":58,\"_69\":81,\"_84\":-5,\"_85\":86,\"_73\":87,\"_88\":89,\"_176\":-5,\"_177\":178,\"_179\":86,\"_180\":181,\"_185\":51,\"_186\":51,\"_187\":188,\"_189\":188,\"_190\":191,\"_205\":206,\"_207\":-5,\"_208\":209},\"id\",\"ef12f6c3-34f8-4e9e-9d92-c549f16a3848\",\"title\",\"Affiliate Marketing Lead, Shop\",\"status\",\"Published\",\"descriptionPlain\",\"ABOUT SHOP\\n\\nShop is the consumer brand inside Shopify. Shop has hundreds of millions of users and lets customers discover new brands, pay quickly and safely via Shop Pay, and track deliveries.\\n\\n\\nABOUT THE ROLE\\n\\nWe are building Shop's paid acquisition channels. Affiliate is one of them, and it is yours to build and run. This is a hands-on role. You will pick the platform, sign the publishers, wire the tracking, set the payouts, watch for fraud, and prove the channel is worth the money. You will help shape the strategy and own the execution.\\n\\nThe mandate: take affiliate from proof of concept to an always-on program with clean tracking, healthy economics and a defensible read on incrementality. You will work with paid media, data, product, creative, Legal, Finance, and external partners to build a new growth capability inside Shop.\\n\\n - Build the program. Select and manage the affiliate platform or network. Own the account setup, tracking implementation, terms, and the partner-facing program details.\\n\\n - Recruit publishers. Source and onboard partners across content and editorial commerce, cashback and rewards, loyalty apps, deal sites and browser extensions. Decide which categories we want, and which we don't.\\n\\n - Own the economics. Set and negotiate commission structures by partner and by action. Model payback, watch cost per install and cost per new buyer, and cut what doesn't pay.\\n\\n - Wire the tracking. Own mobile and web attribution end to end: deep links, deferred deep links, postbacks, install and event tracking, and the QA to prove each link works before it goes live.\\n\\n - Prove incrementality. Last click will flatter this channel. Build the tests that show real lift — holdouts, geo tests, coupon and cashback exclusions — and report the honest number.\\n\\n - Police it. Monitor for fraud and policy abuse: install farms, cookie stuffing, trademark bidding, coupon leakage, off-brand placements. Enforce the terms.\\n\\n - Report and document the numbers. Build dashboards, metric definitions, QA checks, weekly reporting, partner records, tracking conventions, and payout forecasts that make the channel easy to run and evaluate.\\n\\n - Handle the money. Forecast payouts, manage invoicing and accruals with Finance, and keep partner payments accurate and on time.\\n\\n - Work with creative and product. Brief the assets partners need, keep messaging on brand, and work with Shop product teams on landing experience, offer mechanics and the path from click to first purchase.\\n\\n - Use AI. Put AI tools to work on partner research, outreach drafting, anomaly checks and analysis. Speed matters here.\\n\\n\\nWHAT YOU'LL OWN\\n\\n - The affiliate channel end to end: platform, partner mix, terms, tracking, payouts, performance.\\n\\n - Publisher recruitment, onboarding, activation and ongoing relationship management.\\n\\n - Commission structure and partner-level economics, including negotiation.\\n\\n - Attribution and tracking implementation and QA across app and web, with the mobile measurement partner and Shop product teams.\\n\\n - Incrementality testing and the reported effect of the channel.\\n\\n - Fraud, compliance and brand safety monitoring, including FTC disclosure and trademark policy enforcement.\\n\\n - Dashboards, weekly reporting and payout forecasting with Finance.\\n\\n - Partner-facing assets, offers and program communications, built with creative.\\n\\n - Documentation, naming conventions and operating hygiene for the channel.\\n\\n - Proposals for the next partner category or test, backed by data.\\n\\n\\nREQUIREMENTS\\n\\n - 5–10 years in affiliate, partner or performance marketing, with hands-on ownership of an affiliate program at consumer scale.\\n\\n - Direct experience in an affiliate platform (for example Impact, Partnerize, Rakuten, CJ, Awin, or an in-house equivalent). You have run the account, not managed someone who did.\\n\\n - Track record building or scaling a channel, not only inheriting and optimising one.\\n\\n - Strong analytical skills. You can size an opportunity, model payback and write your own SQL or advanced spreadsheet analysis without waiting on an analyst.\\n\\n - Working knowledge of mobile attribution: deep links, deferred deep links, postbacks, install tracking, and tools like AppsFlyer, Branch or Adjust.\\n\\n - Measurement judgment. You know last click overstates affiliate and can design and defend a test that shows true lift.\\n\\n - Experience negotiating commercial terms with partners and comfort holding a partner to them.\\n\\n - Exceptional attention to detail. Broken links, wrong payouts and duplicate credit are the failure modes here, and you catch them before they ship.\\n\\n - Experience spotting and shutting down affiliate fraud and policy abuse.\\n\\n - Clear, concise written communication. Short readouts, plain conclusions, no burying bad results.\\n\\n - Comfortable working with Finance on forecasts, accruals and partner payments.\\n\\n - Bonus: cashback and rewards partners, coupon and extension ecosystems, multi-market programs, commerce or fintech background.\\n\\n\\nABOUT SHOPIFY\\n\\nOpportunity is not evenly distributed. Shopify puts independence within reach for anyone with a dream to start a business. We propel entrepreneurs and enterprises to scale the heights of their potential. Since 2006, we've grown to over 8,300 employees and generated over $1 trillion in sales for millions of merchants in 175 countries.\\n\\nThis is life-defining work that directly impacts people's lives as much as it transforms your own. This is putting the power of the few in the hands of the many, is a future with more voices rather than fewer, and is creating more choices instead of an elite option.\\n\\n\\nABOUT YOU\\n\\nMoving at our pace brings a lot of change, complexity, and ambiguity—and a little bit of chaos. Shopifolk thrive on that and are comfortable being uncomfortable. That means Shopify is not the right place for everyone.\\n\\nBefore you apply, consider if you can:\\n\\n - Care deeply about what you do and about making commerce better for everyone\\n\\n - Excel by seeking professional and personal hypergrowth\\n\\n - Keep up with an unrelenting pace (the week, not the quarter)\\n\\n - Be resilient and resourceful in face of ambiguity and thrive on (rather than endure) change\\n\\n - Bring critical thought and opinion\\n\\n - Put AI agents and tools to work on the tasks they're built for, and focus on the work only humans can do\\n\\n - Embrace differences and disagreement to get shit done and move forward\\n\\n - Work digital-first for your daily work\\n\\nWe may use AI-enabled tools to screen, select, and assess applications. All AI outputs are reviewed and validated by our recruitment team.\",\"descriptionHtml\",\"<h2>About Shop</h2><p>Shop is the consumer brand inside Shopify. Shop has hundreds of millions of users and lets customers discover new brands, pay quickly and safely via Shop Pay, and track deliveries.</p><h2>About the Role</h2><p>We are building Shop's paid acquisition channels. Affiliate is one of them, and it is yours to build and run. This is a hands-on role. You will pick the platform, sign the publishers, wire the tracking, set the payouts, watch for fraud, and prove the channel is worth the money. You will help shape the strategy and own the execution.</p><p></p><p>The mandate: take affiliate from proof of concept to an always-on program with clean tracking, healthy economics and a defensible read on incrementality. You will work with paid media, data, product, creative, Legal, Finance, and external partners to build a new growth capability inside Shop.</p><p></p><ul><li><p><strong>Build the program</strong>. Select and manage the affiliate platform or network. Own the account setup, tracking implementation, terms, and the partner-facing program details.</p></li><li><p><strong>Recruit publishers</strong>. Source and onboard partners across content and editorial commerce, cashback and rewards, loyalty apps, deal sites and browser extensions. Decide which categories we want, and which we don't.</p></li><li><p><strong>Own the economics</strong>. Set and negotiate commission structures by partner and by action. Model payback, watch cost per install and cost per new buyer, and cut what doesn't pay.</p></li><li><p><strong>Wire the tracking. </strong>Own mobile and web attribution end to end: deep links, deferred deep links, postbacks, install and event tracking, and the QA to prove each link works before it goes live.</p></li><li><p><strong>Prove incrementality.</strong> Last click will flatter this channel. Build the tests that show real lift — holdouts, geo tests, coupon and cashback exclusions — and report the honest number.</p></li><li><p><strong>Police it. </strong>Monitor for fraud and policy abuse: install farms, cookie stuffing, trademark bidding, coupon leakage, off-brand placements. Enforce the terms.</p></li><li><p><strong>Report and document the numbers. </strong>Build dashboards, metric definitions, QA checks, weekly reporting, partner records, tracking conventions, and payout forecasts that make the channel easy to run and evaluate.</p></li><li><p><strong>Handle the money. </strong>Forecast payouts, manage invoicing and accruals with Finance, and keep partner payments accurate and on time.</p></li><li><p><strong>Work with creative and product.</strong> Brief the assets partners need, keep messaging on brand, and work with Shop product teams on landing experience, offer mechanics and the path from click to first purchase.</p></li><li><p><strong>Use AI.</strong> Put AI tools to work on partner research, outreach drafting, anomaly checks and analysis. Speed matters here.</p></li></ul><h2>What you'll own</h2><ul><li><p>The affiliate channel end to end: platform, partner mix, terms, tracking, payouts, performance.</p></li><li><p>Publisher recruitment, onboarding, activation and ongoing relationship management.</p></li><li><p>Commission structure and partner-level economics, including negotiation.</p></li><li><p>Attribution and tracking implementation and QA across app and web, with the mobile measurement partner and Shop product teams.</p></li><li><p>Incrementality testing and the reported effect of the channel.</p></li><li><p>Fraud, compliance and brand safety monitoring, including FTC disclosure and trademark policy enforcement.</p></li><li><p>Dashboards, weekly reporting and payout forecasting with Finance.</p></li><li><p>Partner-facing assets, offers and program communications, built with creative.</p></li><li><p>Documentation, naming conventions and operating hygiene for the channel.</p></li><li><p>Proposals for the next partner category or test, backed by data.</p></li></ul><h2>Requirements</h2><ul><li><p>5–10 years in affiliate, partner or performance marketing, with hands-on ownership of an affiliate program at consumer scale.</p></li><li><p>Direct experience in an affiliate platform (for example Impact, Partnerize, Rakuten, CJ, Awin, or an in-house equivalent). You have run the account, not managed someone who did.</p></li><li><p>Track record building or scaling a channel, not only inheriting and optimising one.</p></li><li><p>Strong analytical skills. You can size an opportunity, model payback and write your own SQL or advanced spreadsheet analysis without waiting on an analyst.</p></li><li><p>Working knowledge of mobile attribution: deep links, deferred deep links, postbacks, install tracking, and tools like AppsFlyer, Branch or Adjust.</p></li><li><p>Measurement judgment. You know last click overstates affiliate and can design and defend a test that shows true lift.</p></li><li><p>Experience negotiating commercial terms with partners and comfort holding a partner to them.</p></li><li><p>Exceptional attention to detail. Broken links, wrong payouts and duplicate credit are the failure modes here, and you catch them before they ship.</p></li><li><p>Experience spotting and shutting down affiliate fraud and policy abuse.</p></li><li><p>Clear, concise written communication. Short readouts, plain conclusions, no burying bad results.</p></li><li><p>Comfortable working with Finance on forecasts, accruals and partner payments.</p></li><li><p>Bonus: cashback and rewards partners, coupon and extension ecosystems, multi-market programs, commerce or fintech background.</p></li></ul><h2>About Shopify</h2><p>Opportunity is not evenly distributed. Shopify puts independence within reach for anyone with a dream to start a business. We propel entrepreneurs and enterprises to scale the heights of their potential. Since 2006, we've grown to over 8,300 employees and generated over $1 trillion in sales for millions of merchants in 175 countries.</p><p>This is life-defining work that directly impacts people's lives as much as it transforms your own. This is putting the power of the few in the hands of the many, is a future with more voices rather than fewer, and is creating more choices instead of an elite option.</p><h2>About you</h2><p>Moving at our pace brings a lot of change, complexity, and ambiguity—and a little bit of chaos. Shopifolk thrive on that and are comfortable being uncomfortable. That means Shopify is not the right place for everyone.</p><p>Before you apply, consider if you can:</p><ul><li><p>Care deeply about what you do and about making commerce better for everyone</p></li><li><p>Excel by seeking professional and personal hypergrowth</p></li><li><p>Keep up with an unrelenting pace (the week, not the quarter)</p></li><li><p>Be resilient and resourceful in face of ambiguity and thrive on (rather than endure) change</p></li><li><p>Bring critical thought and opinion</p></li><li><p>Put AI agents and tools to work on the tasks they're built for, and focus on the work only humans can do</p></li><li><p>Embrace differences and disagreement to get shit done and move forward</p></li><li><p>Work digital-first for your daily work</p></li></ul><p>We may use AI-enabled tools to screen, select, and assess applications. All AI outputs are reviewed and validated by our recruitment team.</p><p></p>\",\"descriptionSocial\",\"descriptionParts\",{\"_20\":-5,\"_21\":22,\"_25\":-5},\"descriptionOpening\",\"descriptionBody\",{\"_23\":16,\"_24\":14},\"html\",\"plain\",\"descriptionClosing\",\"departmentName\",\"Shopify\",\"teamName\",\"teamNameHierarchy\",[27],\"jobId\",\"01fe1f59-5724-4763-9ad3-a4a3e853e6e6\",\"locationName\",\"Americas\",\"locationIds\",{\"_37\":38,\"_39\":40},\"primaryLocationId\",\"d5deb7cd-0044-464c-a5da-c1c50f57dcac\",\"secondaryLocationIds\",[],\"workplaceType\",\"Remote\",\"linkedData\",{\"_45\":46,\"_47\":48,\"_9\":10,\"_49\":16,\"_50\":51,\"_52\":53,\"_57\":58,\"_59\":60,\"_66\":67,\"_73\":74,\"_75\":76,\"_77\":78},\"@context\",\"https://schema.org/\",\"@type\",\"JobPosting\",\"description\",\"directApply\",false,\"identifier\",{\"_47\":54,\"_55\":27,\"_56\":8},\"PropertyValue\",\"name\",\"value\",\"datePosted\",\"2026-09-24\",\"hiringOrganization\",{\"_47\":61,\"_55\":27,\"_62\":63,\"_64\":65},\"Organization\",\"sameAs\",\"https://www.shopify.com/\",\"logo\",\"https://app.ashbyhq.com/api/images/org-theme-logo/725e5611-7bcc-46f2-9f96-1518ceb70484/be619593-b0d9-4a65-bb8f-9b0feba2ec03/f2cd90a3-de93-41da-bcf8
