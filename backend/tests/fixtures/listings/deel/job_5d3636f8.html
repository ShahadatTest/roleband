45.js" async=""></script><script src="/_next/static/chunks/5d4fb6ed61cdc859.js" async=""></script><script src="/_next/static/chunks/fdd49536c8b52fc1.js" async=""></script><script src="/_next/static/chunks/88f7838a8c25aac1.js" async=""></script><link rel="preload" href="/_next/static/chunks/63779df893f32e54.css" as="style"/><link rel="preconnect" href="https://s3.amazonaws.com" crossorigin="anonymous"/><link rel="preload" as="font" type="font/woff2" href="https://s3.amazonaws.com/media.letsdeel.com/assets/fonts/Inter-Regular.woff2" crossorigin="anonymous"/><link rel="preload" as="font" type="font/woff2" href="https://s3.amazonaws.com/media.letsdeel.com/assets/fonts/Inter-Medium.woff2" crossorigin="anonymous"/><link rel="preload" as="font" type="font/woff2" href="https://s3.amazonaws.com/media.letsdeel.com/assets/fonts/Inter-SemiBold.woff2" crossorigin="anonymous"/><link rel="preload" as="font" type="font/woff2" href="https://s3.amazonaws.com/media.letsdeel.com/assets/fonts/Bagoss-Medium.woff2" crossorigin="anonymous"/><title>Customer Trust and Experience Agent (Fully Remote - Sweden) @ Klarna</title><meta name="description" content="Klarna, briefly At Klarna, we&#x27;re building an everyday finance network, helping over 120 million consumers across 26 countries save time and money, and worry le…"/><link rel="canonical" href="https://jobs.deel.com/klarna/job-details/5d3636f8-0712-4fe2-a1f4-84358440d272/overview"/><meta property="og:title" content="Customer Trust and Experience Agent (Fully Remote - Sweden) @ Klarna"/><meta property="og:description" content="Klarna, briefly At Klarna, we&#x27;re building an everyday finance network, helping over 120 million consumers across 26 countries save time and money, and worry less about their finances. Working here means taking on problems most companies never get to solve, and being hands-on enough that the interesting part of the work lands with you, not someone else, you&#x27;ll build with AI, not watch it happen. This is the stretch zone. Come find out what you&#x27;re capable of. About the role Some customer cases aren&#x27;t simple, a payment dispute needs untangling, an account question needs real judgment, a pattern needs to be flagged before it turns into ten more tickets. That work sits with Klarna&#x27;s Customer Trust &amp; Experience team, and it&#x27;s what this position covers. You&#x27;ll work end to end on complex, high-friction cases across phone, chat, and email: understanding what went wrong, resetting the customer&#x27;s expectations, and rebuilding their trust in Klarna. Beyond the individual case, you&#x27;ll use Klarna&#x27;s AI tools to spot the patterns behind repeat issues, and turn what you find into structured recommendations that feed back into how Klarna&#x27;s products and operations work. This is a part-time,remote position based in Sweden, with flexible scheduling rather than fixed shifts — details on hours and pay are below, under &quot;Things you should know before applying.&quot; It&#x27;s open both to career professionals with a background in tech, operations, finance, or business, and to university students (year 2 or later) studying engineering, business, economics, law, political science, or a related field. What you&#x27;ll do You&#x27;ll manage complex, high-friction cases end to end, clarifying what happened, resetting expectations, and rebuilding the customer&#x27;s trust in Klarna. You&#x27;ll handle customer conversations across phone, chat, and email, covering both technical and financial questions about their account. You&#x27;ll reach out to customers proactively when you spot an issue, before it turns into an escalation. You&#x27;ll use Klarna&#x27;s AI tools to identify patterns across the cases you handle, and turn what you find into structured, written recommendations for Klarna&#x27;s product and operations teams. You&#x27;ll document the recurring friction points you come across and work with Klarna&#x27;s success teams to help set priorities for fixing them. Who you are You&#x27;ve worked in tech, operations, finance, or business, or you&#x27;re currently in year 2 or later of a university degree in engineering, business, economics, law, political science, or a related field. You have the right to work in the European Union and are based in Sweden, where this position must be performed. You communicate clearly under pressure and are comfortable questioning an established process when you think there&#x27;s a better way to handle something. You look past the individual ticket,you think about why an issue happened and what would stop it from recurring. You&#x27;re comfortable working with AI tools day to day and curious about how they can speed up problem-solving. You keep track of several open cases and administrative tasks at once without letting details slip. Things you should know before applying This is a part-time, variable-hour employee position; Klarna expects a minimum of around 100 hours of availability per month, and employees who work 25+ hours per week tend to perform strongest — there&#x27;s no upper cap, and full-time hours are welcome. During onboarding the first 2–3 weeks a minimum of 75 total hours (roughly 25 hours per week) is required to build product knowledge and confidence, after which the position moves to the flexible monthly setup above. This position is fully remote and open anywhere within Sweden; it cannot be worked from outside of Sweden. You&#x27;ll need your own laptop or desktop running Windows 11 Pro or macOS 15 or newer, a headset with a built-in microphone, and an internet connection with at least 20 Mbit/s download speed. Non-obvious backgrounds are welcome. Diversity of skills, perspectives, and backgrounds is how we create, innovate, and disrupt like no other. Competitive compensation: Earn up to 500 SEK/hour with our surge pricing model. Your base rate is 284.63 SEK/hour, consisting of a 257.00 SEK/hour cash wage and 27.63 SEK/hour in vacation compensation. Vacation compensation is paid out monthly. Please include a CV in English. Concrete beats comprehensive, what you built, what it did, what it cost. Curious to learn more about Klarna and what it&#x27;s like to work here? Explore our career site! Klarna is proud to be an equal opportunity employer. We are committed to building a diverse workforce that reflects our global customer base and to fostering a culture where everyone belongs. We provide equal employment opportunities to all individuals regardless of race, color, religion, creed, sex, sexual orientation, gender identity or expression, national origin, age, disability, genetic information, veteran status, marital status, pregnancy, parental status, or any other characteristic protected by applicable law. We encourage applications from individuals of all backgrounds and identities. We consider qualified applicants with criminal history for employment in accordance with state and local laws and &quot;fair chance&quot; ordinances. If you require reasonable accommodation for any part of the application or hiring process, please contact talent.acquisition@klarna.com."/><meta property="og:image" content="https://s3.eu-west-1.amazonaws.com/api-prod.letsdeel.com/public/ats/7e2ccf5c-ce28-451a-adf0-625015848270/light_logo/C4bjpIXSOrrm5d38Vk7fp"/><meta property="og:type" content="article"/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:title" content="Customer Trust and Experience Agent (Fully Remote - Sweden) @ Klarna"/><meta name="twitter:description" content="Klarna, briefly At Klarna, we&#x27;re building an everyday finance network, helping over 120 million consumers across 26 countries save time and money, and worry less about their finances. Working here me…"/><meta name="twitter:image" content="https://s3.eu-west-1.amazonaws.com/api-prod.letsdeel.com/public/ats/7e2ccf5c-ce28-451a-adf0-625015848270/light_logo/C4bjpIXSOrrm5d38Vk7fp"/><link rel="icon" href="/favicon.ico"/><script src= the stretch zone. Come find out what you're capable of. About the role Some customer cases aren't simple, a payment dispute needs untangling, an account question needs real judgment, a pattern needs to be flagged before it turns into ten more tickets. That work sits with Klarna's Customer Trust \u0026 Experience team, and it's what this position covers. You'll work end to end on complex, high-friction cases across phone, chat, and email: understanding what went wrong, resetting the customer's expectations, and rebuilding their trust in Klarna. Beyond the individual case, you'll use Klarna's AI tools to spot the patterns behind repeat issues, and turn what you find into structured recommendations that feed back into how Klarna's products and operations work. This is a part-time,remote position based in Sweden, with flexible scheduling rather than fixed shifts — details on hours and pay are below, under \"Things you should know before applying.\" It's open both to career professionals with a background in tech, operations, finance, or business, and to university students (year 2 or later) studying engineering, business, economics, law, political science, or a related field. What you'll do You'll manage complex, high-friction cases end to end, clarifying what happened, resetting expectations, and rebuilding the customer's trust in Klarna. You'll handle customer conversations across phone, chat, and email, covering both technical and financial questions about their account. You'll reach out to customers proactively when you spot an issue, before it turns into an escalation. You'll use Klarna's AI tools to identify patterns across the cases you handle, and turn what you find into structured, written recommendations for Klarna's product and operations teams. You'll document the recurring friction points you come across and work with Klarna's success teams to help set priorities for fixing them. Who you are You've worked in tech, operations, finance, or business, or you're currently in year 2 or later of a university degree in engineering, business, economics, law, political science, or a related field. You have the right to work in the European Union and are based in Sweden, where this position must be performed. You communicate clearly under pressure and are comfortable questioning an established process when you think there's a better way to handle something. You look past the individual ticket,you think about why an issue happened and what would stop it from recurring. You're comfortable working with AI tools day to day and curious about how they can speed up problem-solving. You keep track of several open cases and administrative tasks at once without letting details slip. Things you should know before applying This is a part-time, variable-hour employee position; Klarna expects a minimum of around 100 hours of availability per month, and employees who work 25+ hours per week tend to perform strongest — there's no upper cap, and full-time hours are welcome. During onboarding the first 2–3 weeks a minimum of 75 total hours (roughly 25 hours per week) is required to build product knowledge and confidence, after which the position moves to the flexible monthly setup above. This position is fully remote and open anywhere within Sweden; it cannot be worked from outside of Sweden. You'll need your own laptop or desktop running Windows 11 Pro or macOS 15 or newer, a headset with a built-in microphone, and an internet connection with at least 20 Mbit/s download speed. Non-obvious backgrounds are welcome. Diversity of skills, perspectives, and backgrounds is how we create, innovate, and disrupt like no other. Competitive compensation: Earn up to 500 SEK/hour with our surge pricing model. Your base rate is 284.63 SEK/hour, consisting of a 257.00 SEK/hour cash wage and 27.63 SEK/hour in vacation compensation. Vacation compensation is paid out monthly. Please include a CV in English. Concrete beats comprehensive, what you built, what it did, what it cost. Curious to learn more about Klarna and what it's like to work here? Explore our career site! Klarna is proud to be an equal opportunity employer. We are committed to building a diverse workforce that reflects our global customer base and to fostering a culture where everyone belongs. We provide equal employment opportunities to all individuals regardless of race, color, religion, creed, sex, sexual orientation, gender identity or expression, national origin, age, disability, genetic information, veteran status, marital status, pregnancy, parental status, or any other characteristic protected by applicable law. We encourage applications from individuals of all backgrounds and identities. We consider qualified applicants with criminal history for employment in accordance with state and local laws and \"fair chance\" ordinances. If you require reasonable accommodation for any part of the application or hiring process, please contact talent.acquisition@klarna.com."])</script><script>self.__next_f.push([1,"12:[[\"$\",\"title\",\"0\",{\"children\":\"Customer Trust and Experience Agent (Fully Remote - Sweden) @ Klarna\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Klarna, briefly At Klarna, we're building an everyday finance network, helping over 120 million consumers across 26 countries save time and money, and worry le…\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://jobs.deel.com/klarna/job-details/5d3636f8-0712-4fe2-a1f4-84358440d272/overview\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"Customer Trust and Experience Agent (Fully Remote - Sweden) @ Klarna\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"$19\"}],\"$L1a\",\"$L1b\",\"$L1c\",\"$L1d\",\"$L1e\",\"$L1f\",\"$L20\",\"$L21\"]\n"])</script><script>self.__next_f.push([1,"22:I[778704,[\"/_next/static/chunks/5c63822aa972058f.js\",\"/_next/static/chunks/f636b7831394fdc6.js\"],\"IconMark\"]\n1a:[\"$\",\"meta\",\"5\",{\" t once without letting details slip.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eThings you should know before applying\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003eThis is a part-time, variable-hour employee position; Klarna expects a minimum of around 100 hours of availability per month, and employees who work 25+ hours per week tend to perform strongest — there's no upper cap, and full-time hours are welcome.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDuring onboarding  the first 2–3 weeks a minimum of 75 total hours (roughly 25 hours per week) is required to build product knowledge and confidence, after which the position moves to the flexible monthly setup above.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eThis position is fully remote and open anywhere within Sweden; it cannot be worked from outside of Sweden.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eYou'll need your own laptop or desktop running Windows 11 Pro or macOS 15 or newer, a headset with a built-in microphone, and an internet connection with at least 20 Mbit/s download speed.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNon-obvious backgrounds are welcome. Diversity of skills, perspectives, and backgrounds is how we create, innovate, and disrupt like no other.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCompetitive compensation:\u003c/strong\u003e Earn up to 500 SEK/hour with our surge pricing model. Your base rate is 284.63 SEK/hour, consisting of a 257.00 SEK/hour cash wage and 27.63 SEK/hour in vacation compensation. Vacation compensation is paid out monthly.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003ePlease include a CV in English. Concrete beats comprehensive , what you built, what it did, what it cost. Curious to learn more about Klarna and what it's like to work here? Explore our\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.klarna.com/careers/\"\u003e \u003cu\u003ecareer site\u003c/u\u003e\u003c/a\u003e!\u003c/p\u003e\u003cp\u003eKlarna is proud to be an equal opportunity employer. We are committed to building a diverse workforce that reflects our global customer base and to fostering a culture where everyone belongs. We provide equal employment opportunities to all individuals regardless of race, color, religion, creed, sex, sexual orientation, gender identity or expression, national origin, age, disability, genetic information, veteran status, marital status, pregnancy, parental status, or any other characteristic protected by applicable law. We encourage applications from individuals of all backgrounds and identities. We consider qualified applicants with criminal history for employment in accordance with state and local laws and \"fair chance\" ordinances. If you require reasonable accommodation for any part of the application or hiring process, please contact \u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"mailto:talent.acquisition@klarna.com\"\u003e\u003cu\u003etalent.acquisition@klarna.com\u003c/u\u003e\u003c/a\u003e.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"25:T1c46,"])</script><script>self.__next_f.push([1,"{\"id\":\"1c8bdae9-3eae-46f6-8e98-e76d8c7a4169\",\"title\":\"2a6b270c-e62b-44d2-9db2-3fbce77342ea - Application Form - 2026-09-22T12:39:46.947Z\",\"subtitle\":null,\"version\":28,\"status\":\"PUBLISHED\",\"pages\":[{\"id\":\"975af907-4bad-42e0-9f9a-17c5deb23390\",\"title\":\"Page name 1\",\"sections\":[{\"id\":\"5f3eeab1-7657-4335-a399-3da1f9e659c5\",\"title\":\"Mandatory\",\"questions\":[{\"id\":\"448f1010-98c3-4186-9962-4003df5e428d\",\"title\":\"Do you have the right to work in Sweden?\",\"type\":\"SingleSelection\",\"dataBinding\":\"be135b33-0861-4403-a958-43ee6e7a84fb\",\"isRequired\":true,\"options\":[{\"id\":\"3a291465-3033-425f-8e40-cbee5d57f33a\",\"title\":\"Yes\",\"dataBinding\":\"ceb8b3a0- otFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"27:T1806,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org/\",\"@type\":\"JobPosting\",\"title\":\"Customer Trust and Experience Agent (Fully Remote - Sweden)\",\"description\":\"Klarna, briefly At Klarna, we're building an everyday finance network, helping over 120 million consumers across 26 countries save time and money, and worry less about their finances. Working here means taking on problems most companies never get to solve, and being hands-on enough that the interesting part of the work lands with you, not someone else, you'll build with AI, not watch it happen. This is the stretch zone. Come find out what you're capable of. About the role Some customer cases aren't simple, a payment dispute needs untangling, an account question needs real judgment, a pattern needs to be flagged before it turns into ten more tickets. That work sits with Klarna's Customer Trust \u0026 Experience team, and it's what this position covers. You'll work end to end on complex, high-friction cases across phone, chat, and email: understanding what went wrong, resetting the customer's expectations, and rebuilding their trust in Klarna. Beyond the individual case, you'll use Klarna's AI tools to spot the patterns behind repeat issues, and turn what you find into structured recommendations that feed back into how Klarna's products and operations work. This is a part-time,remote position based in Sweden, with flexible scheduling rather than fixed shifts — details on hours and pay are below, under \\\"Things you should know before applying.\\\" It's open both to career professionals with a background in tech, operations, finance, or business, and to university students (year 2 or later) studying engineering, business, economics, law, political science, or a related field. What you'll do You'll manage complex, high-friction cases end to end, clarifying what happened, resetting expectations, and rebuilding the customer's trust in Klarna. You'll handle customer conversations across phone, chat, and email, covering both technical and financial questions about their account. You'll reach out to customers proactively when you spot an issue, before it turns into an escalation. You'll use Klarna's AI tools to identify patterns across the cases you handle, and turn what you find into structured, written recommendations for Klarna's product and operations teams. You'll document the recurring friction points you come across and work with Klarna's success teams to help set priorities for fixing them. Who you are You've worked in tech, operations, finance, or business, or you're currently in year 2 or later of a university degree in engineering, business, economics, law, political science, or a related field. You have the right to work in the European Union and are based in Sweden, where this position must be performed. You communicate clearly under pressure and are comfortable questioning an established process when you think there's a better way to handle something. You look past the individual ticket,you think about why an issue happened and what would stop it from recurring. You're comfortable working with AI tools day to day and curious about how they can speed up problem-solving. You keep track of several open cases and administrative tasks at once without letting details slip. Things you should know before applying This is a part-time, variable-hour employee position; Klarna expects a minimum of around 100 hours of availability per month, and employees who work 25+ hours per week tend to perform strongest — there's no upper cap, and full-time hours are welcome. During onboarding the first 2–3 weeks a minimum of 75 total hours (roughly 25 hours per week) is required to build product knowledge and confidence, after which the position moves to the flexible monthly setup above. This position is fully remote and open anywhere within Sweden; it cannot be worked from outside of Sweden. You'll need your own laptop or desktop running Windows 11 Pro or macOS 15 or newer, a headset with a built-in microphone, and an internet connection with at least 20 Mbit/s download speed. Non-obvious backgrounds are welcome. Diversity of skills, perspectives, and backgrounds is how we create, innovate, and disrupt like no other. Competitive compensation: Earn up to 500 SEK/hour with our surge pricing model. Your base rate is 284.63 SEK/hour, consisting of a 257.00 SEK/hour cash wage and 27.63 SEK/hour in vacation compensation. Vacation compensation is paid out monthly. Please include a CV in English. Concrete beats comprehensive, what you built, what it did, what it cost. Curious to learn more about Klarna and what it's like to work here? Explore our career site! Klarna is proud to be an equal opportunity employer. We are committed to building a diverse workforce that reflects our global customer base and to fostering a culture where everyone belongs. We provide equal employment opportunities to all individuals regardless of race, color, religion, creed, sex, sexual orientation, gender identity or expression, national origin, age, disability, genetic information, veteran status, marital status, pregnancy, parental status, or any other characteristic protected by applicable law. We encourage applications from individuals of all backgrounds and identities. We consider qualified applicants with criminal history for employment in accordance with state and local laws and \\\"fair chance\\\" ordinances. If you require reasonable accommodation for any part of the application or hiring process, please contact talent.acquisition@klarna.com.\",\"datePosted\":\"2026-04-21T07:45:50.278Z\",\"employmentType\":[\"CONTRACTOR\"],\"hiringOrganization\":{\"@type\":\"Organization\",\"name\":\"Klarna\",\"logo\":\"https://s3.eu-west-1.amazonaws.com/api-prod.letsdeel.com/public/ats/7e2ccf5c-ce28-451a-adf0-
