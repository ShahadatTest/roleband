[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roleband-plugin-sdk"
version = "1.0.0"
description = "The contract between a RoleBand plugin and its host: manifest, slot rows, stdio runner, fake host."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "roleband-robots>=1,<2"]

[tool.setuptools]
packages = ["roleband_plugin_sdk"]

[tool.setuptools.package-data]
roleband_plugin_sdk = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # as in backend/: line length is not enforced

[tool.ruff.lint.isort]
known-first-party = ["roleband_plugin_sdk"]
