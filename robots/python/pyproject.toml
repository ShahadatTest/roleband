[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roleband-robots"
version = "1.0.0"
description = "RFC 9309 robots.txt evaluation: one answer for the host and for a plugin author's tests."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["roleband_robots"]

[tool.setuptools.package-data]
roleband_robots = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
